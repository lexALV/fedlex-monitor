name: Fedlex-Monitor veröffentlichen

on:
  schedule:
    - cron: "17 6 * * *"
      timezone: "Europe/Zurich"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fedlex-github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Daten abrufen und Dateien erzeugen
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Tests ausführen
        run: >-
          python -m unittest discover
          -s tests
          -v

      - name: Fedlex-Dateien per SPARQL POST erzeugen
        run: python monitor.py

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Statische Dateien hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: GitHub Pages veröffentlichen
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
